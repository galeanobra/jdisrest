# NSGA-II configuration for a problem of binary variables (a jMetal problem whose solutions are
# BinarySolutions), such as jMetal's ZDT5: 11 variables, one of 30 bits and ten of 5, 80 bits in
# all, 2 objectives. The keys that are not operator keys are those of every problem;
# nsgaii.properties has the operators of real variables, and integer.properties and
# composite.properties those of the other encodings.
#
# Usage, with a class path that holds jdisrest, its dependencies and your problem, whose class
# has a public no-argument constructor:
#   java -cp <classpath> es.unex.jdisrest.config.ConfiguredMaster \
#        org.uma.jmetal.problem.multiobjective.zdt.ZDT5 <host> <port> binary.properties \
#        [key=value ...]
#   java -cp <classpath> es.unex.jdisrest.config.ConfiguredMaster \
#        org.uma.jmetal.problem.multiobjective.zdt.ZDT5 --check binary.properties [key=value ...]
# --check validates the file against the problem and prints a summary, then a second line with
# the bits and the keys of their operators, without starting the master. Each key=value
# argument replaces or adds that key, taken literally, for instance maxEvaluations=200 for a
# short test.
#
# Rules for every key:
# - Only algorithm and maxEvaluations are required; every other key below shows its default.
# - Names of algorithms and operators are case-insensitive; spaces around values are ignored.
# - A key that NSGA-II or the chosen operators do not use is an error, so a misspelt key is never
#   silently ignored. If a key is written twice, the last occurrence wins.
# - Any probability may be written as k/n: k divided by the number of bits of the problem, those
#   of all its variables (80 for ZDT5, whose 1/n is 1/80), not by the number of its variables.
# - The file is read as UTF-8. A backslash starts an escape sequence (\t is a tab), so write
#   Windows paths with / or with doubled backslashes: C:/runs/traces or C:\\runs\\traces.
# - While the run goes on, GET /api/v1/config returns the configuration in use and
#   POST /api/v1/config replaces it with a complete file (keys left out take their defaults).
#   algorithm, populationSize and tracesFolder cannot change; everything else can.

algorithm = nsgaii

# Evaluations after which the run stops: a positive integer.
maxEvaluations = 25000

# Number of solutions of the population: a positive integer.
populationSize = 100

# Folder for the trace files, relative to the working directory of the master (default: none,
# no traces). The traces are snapshots of the population and of the archive, written every
# populationSize evaluations and once more when the run ends, with each binary variable as its
# bit string, bit 0 first. The master also copies this file there, with the command-line
# overrides, and records every configuration change made during the run.
tracesFolder = traces

# Crossover of binary variables: singlePoint, hux or uniform (default singlePoint), jMetal's
# operators, which have no parameters and keep the length of every variable.
#   crossover.probability        probability of crossing a pair of parents, in [0, 1] or k/n
#                                (default 0.9)
#   singlePoint  the children swap every bit from a random bit of the whole solution on, in
#                any variable, to the end of the solution
#   hux          each bit in which the parents differ is swapped with probability 0.5
#   uniform      each bit is swapped with probability 0.5
crossover = singlePoint
crossover.probability = 0.9

# Mutation of binary variables: bitFlip (the default), jMetal's operator, which has no
# parameters.
#   mutation.probability         probability of flipping each bit, in [0, 1] or k/n (default
#                                1/n, one bit of the solution per mutation on average)
mutation = bitFlip
mutation.probability = 1/n
