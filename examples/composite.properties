# PAES configuration for a problem whose solutions are composite (a jMetal problem whose
# solutions are CompositeSolutions of real, integer and binary segments), such as jMetal's
# MixedIntegerDoubleProblem: an integer segment and a real one of 10 variables each, in
# [-1000, 1000], 2 objectives. Each segment has operators of its own, from the catalogue of its
# encoding; the keys that are not operator keys are those of every problem (see paes.properties).
#
# Usage, with a class path that holds jdisrest, its dependencies and your problem, whose class
# has a public no-argument constructor:
#   java -cp <classpath> es.unex.jdisrest.config.ConfiguredMaster \
#        org.uma.jmetal.problem.multiobjective.MixedIntegerDoubleProblem \
#        <host> <port> composite.properties [key=value ...]
#   java -cp <classpath> es.unex.jdisrest.config.ConfiguredMaster \
#        org.uma.jmetal.problem.multiobjective.MixedIntegerDoubleProblem \
#        --check composite.properties [key=value ...]
# --check validates the file against the problem and prints a summary, then a second line with
# the segments and the keys of their operators, without starting the master. Each key=value
# argument replaces or adds that key, taken literally, for instance maxEvaluations=200 for a
# short test.
#
# Rules for every key:
# - Only algorithm and maxEvaluations are required; every other key below shows its default,
#   except the mutation of the integer segment, set here to show a choice of one segment.
# - Names of algorithms and operators are case-insensitive; spaces around values are ignored.
# - Every operator key takes the name of its segment as prefix: <segment>.mutation,
#   <segment>.mutation.probability and <segment>.mutation.<parameter>, and in NSGA-II and MOEA/D
#   <segment>.crossover, <segment>.crossover.probability and <segment>.crossover.<parameter>.
#   The operator keys without a prefix are unknown for a composite problem. A file whose operator
#   keys carry the names of segments fits any composite whose segments have those names: a
#   segment that the file does not name takes the default operators of its encoding without a
#   warning, and the second line of --check names every segment and the keys of its operators.
#   A segment takes the name of its encoding, real, integer or binary, numbered from 1 when an
#   encoding repeats (integer1, real, integer2), unless the problem names its segments by
#   implementing es.unex.jdisrest.config.NamedSegments.
# - A key that PAES or the chosen mutations do not use is an error, so a misspelt key is never
#   silently ignored. If a key is written twice, the last occurrence wins.
# - Any probability may be written as k/n. In the probability of an operator, n is the size of
#   its segment: its variables, or the bits of all its variables for a binary segment, so 1/n is
#   1 in a segment of one variable. In archiveSelectionProbability, n is the sum of the sizes of
#   the segments.
# - The file is read as UTF-8. A backslash starts an escape sequence (\t is a tab), so write
#   Windows paths with / or with doubled backslashes: C:/runs/traces or C:\\runs\\traces.
# - While the run goes on, GET /api/v1/config returns the configuration in use and
#   POST /api/v1/config replaces it with a complete file (keys left out take their defaults),
#   with the same prefixes. algorithm, archiveSize and tracesFolder cannot change; everything
#   else can, the operators of each segment included.

algorithm = paes

# Evaluations after which the run stops: a positive integer.
maxEvaluations = 25000

# Maximum number of solutions of the PAES archive, a crowding-distance archive: a positive
# integer.
archiveSize = 100

# Folder for the trace files, relative to the working directory of the master (default: none,
# no traces). The traces are snapshots of the archives, written every archiveSize evaluations
# and once more when the run ends, with the variables of every segment of a solution on its row.
# The master also copies this file there, with the command-line overrides, and records every
# configuration change made during the run.
tracesFolder = traces

# PAES uses no crossover. Mutation of the integer segment: polynomial, random or gaussian
# (default polynomial; see integer.properties for their parameters).
#   integer.mutation.probability  probability of mutating each variable of the segment, in
#                                 [0, 1] or k/n (default 1/n)
integer.mutation = random
# 2 of its 10 variables per mutation, on average
integer.mutation.probability = 2/n

# Mutation of the real segment: polynomial, linkedPolynomial, uniform, random, levyFlight or
# levyRandom (default polynomial; see paes.properties for their parameters).
#   real.mutation.probability     probability of mutating each variable of the segment, in
#                                 [0, 1] or k/n (default 1/n)
real.mutation = polynomial
real.mutation.probability = 1/n
real.mutation.distributionIndex = 20

# A binary segment, binary for instance, would take binary.mutation = bitFlip and
# binary.mutation.probability, whose n counts its bits (see binary.properties).

# Probability of mutating a random member of the archive instead of the current solution, in
# [0, 1] or k/n (default 0, the classic PAES rule: the current solution is always the parent).
archiveSelectionProbability = 0.0

# Result of the run: paes (the PAES archive, the default) or external (every non-dominated
# solution evaluated, reduced to archiveSize solutions, as the other algorithms return).
result = paes
