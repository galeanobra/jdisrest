# MOEA/D configuration for a problem of integer variables (a jMetal problem whose solutions are
# IntegerSolutions), such as jMetal's NMMin: 20 variables in [-1000, 1000], 2 objectives. The keys
# that are not operator keys are those of every problem; moead.properties has the operators of
# real variables, and binary.properties and composite.properties those of the other encodings.
#
# Usage, with a class path that holds jdisrest, its dependencies and your problem, whose class
# has a public no-argument constructor:
#   java -cp <classpath> es.unex.jdisrest.config.ConfiguredMaster \
#        org.uma.jmetal.problem.multiobjective.NMMin <host> <port> integer.properties \
#        [key=value ...]
#   java -cp <classpath> es.unex.jdisrest.config.ConfiguredMaster \
#        org.uma.jmetal.problem.multiobjective.NMMin --check integer.properties [key=value ...]
# --check validates the file against the problem and prints a summary, then a second line with
# the variables and the keys of their operators, without starting the master. Each key=value
# argument replaces or adds that key, taken literally, for instance maxEvaluations=200 for a
# short test.
#
# Rules for every key:
# - Only algorithm and maxEvaluations are required; every other key below shows its default.
# - Names of algorithms and operators are case-insensitive; spaces around values are ignored.
# - A key that MOEA/D or the chosen operators do not use is an error, so a misspelt key is never
#   silently ignored. If a key is written twice, the last occurrence wins.
# - Any probability may be written as k/n: k divided by the number of variables of the problem.
# - The file is read as UTF-8. A backslash starts an escape sequence (\t is a tab), so write
#   Windows paths with / or with doubled backslashes: C:/runs/traces or C:\\runs\\traces.
# - While the run goes on, GET /api/v1/config returns the configuration in use and
#   POST /api/v1/config replaces it with a complete file (keys left out take their defaults).
#   algorithm, populationSize, weights, neighborSize and tracesFolder cannot change; everything
#   else can.

algorithm = moead

# Evaluations after which the run stops: a positive integer.
maxEvaluations = 25000

# Number of subproblems, each with a weight vector and one solution of the population: a
# positive integer.
populationSize = 100

# Weight vectors: spread or lattice (default spread). spread takes any populationSize: it starts
# from the corners (one objective each) and adds, one at a time, the candidate farthest from the
# vectors already chosen, among candidates drawn with a fixed seed, so every run gets the same
# vectors. lattice is the regular simplex lattice of Das and Dennis, which only exists for
# C(H+m-1, m-1) vectors with m objectives and H divisions: any size for 2 objectives, but only
# ..., 78, 91, 105, ... for 3 (H = 11, 12, 13); with another size the configuration is rejected
# and the message names the two closest valid sizes. With a traces folder the master writes the
# vectors to weights.csv in it, one line per subproblem.
weights = spread

# Folder for the trace files, relative to the working directory of the master (default: none,
# no traces). The traces are snapshots of the population and of the archive, written every
# populationSize evaluations and once more when the run ends. The master also copies this file
# there, with the command-line overrides, and records every configuration change made during
# the run.
tracesFolder = traces

# Neighborhood of each subproblem: the neighborSize subproblems with the closest weights, an
# integer from 1 to populationSize (default 20, or populationSize if it is smaller). With
# probability neighborhoodSelectionProbability, in [0, 1] (default 0.9), the parents come from
# the neighborhood, otherwise from the whole population. Each offspring replaces at most
# maximumNumberOfReplacedSolutions solutions of the neighborhood, an integer from 1 to
# neighborSize (default 2, or neighborSize if it is smaller).
neighborSize = 20
neighborhoodSelectionProbability = 0.9
maximumNumberOfReplacedSolutions = 2

# Aggregation that compares solutions within a subproblem: tchebycheff, wsum (weighted sum) or
# pbi (penalty-based boundary intersection, theta 5) (default tchebycheff).
aggregation = tchebycheff

# Whether the aggregation normalizes each objective by its range between the ideal point (the
# minimum of everything evaluated) and the nadir point (the maximum over the non-dominated
# solutions), so that objectives of very different scales weigh the same: true or false
# (default false, as in jMetal).
normalizeObjectives = false

# Crossover of integer variables: sbx or blxAlpha (default sbx). Both compute a real value for
# each child, which they round to the nearest integer within the bounds of the variable; they
# are jdisrest's own IntegerSBXCrossover and IntegerBLXCrossover (jMetal's IntegerSBXCrossover
# truncates toward zero).
#   crossover.probability        probability of crossing a pair of parents, in [0, 1] or k/n
#                                (default 0.9)
#   sbx         crossover.distributionIndex  >= 0 (default 20); larger values give children
#                                            closer to their parents
#   blxAlpha    crossover.alpha              >= 0 (default 0.5); how much the interval between
#                                            the parents' values is widened on each side
crossover = sbx
crossover.probability = 0.9
crossover.distributionIndex = 20

# Mutation of integer variables: polynomial, random or gaussian (default polynomial), jdisrest's
# operators, which keep each value an integer within the bounds of its variable.
#   mutation.probability         probability of mutating each variable, in [0, 1] or k/n
#                                (default 1/n)
#   polynomial  mutation.distributionIndex  >= 0 (default 20); larger values give smaller
#                                           steps. A step is a fraction of the range of the
#                                           variable, rounded to the nearest integer, so on a
#                                           range of a few values, such as [0, 1], it seldom
#                                           changes the value: random suits such variables
#   random      no parameters; a new value within the bounds, every integer equally likely
#   gaussian    no parameters; adds a Gaussian step of standard deviation max(2, range/2),
#               rounded and clamped to the bounds, so the steps are wide
mutation = polynomial
mutation.probability = 1/n
mutation.distributionIndex = 20
