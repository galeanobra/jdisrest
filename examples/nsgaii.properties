# NSGA-II configuration for a real-coded problem (a jMetal DoubleProblem).
#
# Usage, with a class path that holds jdisrest, its dependencies and your problem, whose class
# has a public no-argument constructor:
#   java -cp <classpath> es.unex.jdisrest.config.ConfiguredMaster com.example.MyProblem \
#        <host> <port> nsgaii.properties [key=value ...]
#   java -cp <classpath> es.unex.jdisrest.config.ConfiguredMaster com.example.MyProblem \
#        --check nsgaii.properties [key=value ...]
# --check validates the file against the problem and prints a summary without starting the
# master. Each key=value argument replaces or adds that key, taken literally, for instance
# maxEvaluations=200 for a short test.
#
# Rules for every key:
# - Only algorithm and maxEvaluations are required; every other key below shows its default.
# - Names of algorithms and operators are case-insensitive; spaces around values are ignored.
# - A key that NSGA-II or the chosen operators do not use is an error, so a misspelt key is never
#   silently ignored. If a key is written twice, the last occurrence wins.
# - Any probability may be written as k/n: k divided by the number of variables of the problem.
# - The file is read as UTF-8. A backslash starts an escape sequence (\t is a tab), so write
#   Windows paths with / or with doubled backslashes: C:/runs/traces or C:\\runs\\traces.
# - While the run goes on, GET /api/v1/config returns the configuration in use and
#   POST /api/v1/config replaces it with a complete file (keys left out take their defaults).
#   algorithm, populationSize and tracesFolder cannot change; everything else can.

algorithm = nsgaii

# Evaluations after which the run stops: a positive integer.
maxEvaluations = 25000

# Number of solutions of the population: a positive integer.
populationSize = 100

# Folder for the trace files, relative to the working directory of the master (default: none,
# no traces). The traces are snapshots of the population, written every populationSize
# evaluations. The master also copies this file there, with the command-line overrides, and
# records every configuration change made during the run.
tracesFolder = traces

# Crossover: sbx, blxAlpha, laplace, arithmetic, wholeArithmetic or nPoint (default sbx).
#   crossover.probability        probability of crossing a pair of parents, in [0, 1] or k/n
#                                (default 0.9)
#   sbx         crossover.distributionIndex  >= 0 (default 20); larger values give children
#                                            closer to their parents
#   blxAlpha    crossover.alpha              >= 0 (default 0.5); how much the interval between
#                                            the parents' values is widened on each side
#   laplace     crossover.scale              > 0 (default 0.5); scale of the Laplace offsets
#   arithmetic, wholeArithmetic              no parameters (a random weight per variable, or
#                                            one for the whole solution)
#   nPoint      crossover.points             number of cuts, an integer from 1 to the number of
#                                            blocks minus 1 (default 2)
#               crossover.blockSize          consecutive variables a cut never separates, an
#                                            integer that divides the number of variables
#                                            (default 1)
crossover = sbx
crossover.probability = 0.9
crossover.distributionIndex = 20

# Mutation: polynomial, linkedPolynomial, uniform, random, levyFlight or levyRandom
# (default polynomial).
#   mutation.probability         probability of mutating each variable, in [0, 1] or k/n
#                                (default 1/n)
#   polynomial, linkedPolynomial mutation.distributionIndex  >= 0 (default 20); larger values
#                                give smaller perturbations
#   uniform     mutation.perturbation  > 0 (default 0.5); adds a uniform value in
#                                      [-perturbation/2, perturbation/2), in the units of the
#                                      variable
#   random      no parameters; a new random value within the bounds of the variable
#   levyFlight  mutation.beta          in (1, 2) (default 1.5); steps shrink strongly as beta
#                                      approaches 2
#               mutation.stepSize      > 0 (default 0.01), times the range of the variable
#   levyRandom  as levyFlight, but each mutated solution draws its step size uniformly in
#               [0, mutation.stepSize), so the mean step size is half of mutation.stepSize
mutation = polynomial
mutation.probability = 1/n
mutation.distributionIndex = 20
