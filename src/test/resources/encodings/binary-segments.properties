# MOEA/D for BinarySegmentsRunIT: the operators of two binary segments, which take the name of
# their encoding, numbered since it repeats. The run sets maxEvaluations and tracesFolder.
algorithm = moead
maxEvaluations = 200
populationSize = 20

binary1.crossover = hux
binary1.crossover.probability = 0.9
binary1.mutation = bitFlip
binary1.mutation.probability = 1/n

binary2.crossover = uniform
binary2.crossover.probability = 0.9
binary2.mutation = bitFlip
binary2.mutation.probability = 1/n
