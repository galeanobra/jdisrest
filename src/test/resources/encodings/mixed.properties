# PAES for MixedRunIT: the operators of an integer, a real and a binary segment, which take the
# names of their encodings. The run raises maxEvaluations, and changes the mutation of the
# binary segment, through POST /api/v1/config before its first result.
algorithm = paes
maxEvaluations = 100
archiveSize = 20

integer.mutation = random
integer.mutation.probability = 1/n

real.mutation = polynomial
real.mutation.probability = 1/n
real.mutation.distributionIndex = 20

binary.mutation = bitFlip
binary.mutation.probability = 1/n
